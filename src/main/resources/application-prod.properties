# Perfil de producao: conecta no MongoDB informado pela variavel de ambiente MONGODB_URI
# Ex.: MONGODB_URI=mongodb+srv://usuario:senha@cluster.mongodb.net/thindesk
spring.data.mongodb.uri=${MONGODB_URI}
spring.autoconfigure.exclude=de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration
thindesk.seed.enabled=${THINDESK_SEED:false}
thindesk.seed.quantidade=320
