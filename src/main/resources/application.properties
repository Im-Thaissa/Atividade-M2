# Perfil ativo: "dev" (MongoDB embarcado + dados de exemplo) ou "prod" (MongoDB externo via MONGODB_URI)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.data.mongodb.database=thindesk
spring.data.mongodb.auto-index-creation=true

# Usuario e senha padrao do sistema (podem ser sobrescritos por variaveis de ambiente)
spring.security.user.name=${THINDESK_USER:admin}
spring.security.user.password=${THINDESK_PASSWORD:thindesk}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Datas da API no formato ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

logging.level.com.pfc=INFO
